name: AnkiClone
options:
  bundleIdPrefix: com.ankiclone
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_FILE: AnkiClone/Info.plist

targets:
  AnkiClone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AnkiClone
    settings:
      base:
        INFOPLIST_FILE: AnkiClone/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ankiclone.app
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: iphonesimulator iphoneos
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      - package: ZIPFoundation

  AnkiCloneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - AnkiCloneTests
    dependencies:
      - target: AnkiClone

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

schemes:
  AnkiClone:
    build:
      targets:
        AnkiClone: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AnkiCloneTests
